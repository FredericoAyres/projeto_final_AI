# Registro único dos bancos de dados. Um item por pasta de data/raw/.
# role:   train_val | real_control | test_generalization | test_ptbr
# access: open | login | gated   (null = desconhecido)
# status: pending (atualizar conforme baixarmos)

datasets:
  - name: asvspoof2019_la
    role: train_val
    language: en
    contains: both
    url: https://datashare.ed.ac.uk/handle/10283/3336
    license: ODC-By
    access: open
    status: pending
    local_path: data/raw/train_val_en/asvspoof2019_la/

  # precisa juntar a pasta VCTK_BONAFIDE de cada subconjunto
  - name: dfadd
    role: train_val
    language: en
    contains: both
    url: https://huggingface.co/datasets/isjwdu/DFADD
    license: null
    access: open
    status: pending
    local_path: data/raw/train_val_en/dfadd/

  # baixar só alguns vocoders
